services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.15.1
    container_name: technical-blog-mlflow
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - mlflow_db:/mlflow/db
      - mlflow_artifacts:/mlflow/artifacts
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////mlflow/db/mlflow.db
      - --artifacts-destination
      - /mlflow/artifacts

volumes:
  mlflow_db:
  mlflow_artifacts:
