services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.15.1
    container_name: technical-blog-mlflow
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - mlflow_db:/mlflow/db
      - mlflow_artifacts:/mlflow/artifacts
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --allowed-hosts
      - localhost,127.0.0.1,mlflow,mlflow:5000
      - --backend-store-uri
      - sqlite:////mlflow/db/mlflow.db
      - --artifacts-destination
      - /mlflow/artifacts

  review-ui:
    profiles: ["human-review"]
    build:
      context: ../..
      dockerfile: infra/review-ui/Dockerfile
    container_name: technical-blog-review-ui
    restart: unless-stopped
    depends_on:
      - mlflow
    ports:
      - "127.0.0.1:5051:5051"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      ARTICLE_PATH: /article/article.md
      REVIEW_QUEUE_ID: ${REVIEW_QUEUE_ID:-}
      REVIEW_TRACE_ID: ${REVIEW_TRACE_ID:-}
      REVIEWER_ID: ${REVIEWER_ID:-tera}
    volumes:
      - "${ARTICLE_PROJECT_DIR:-/tmp/technical-blog-article}:/article:ro"

volumes:
  mlflow_db:
  mlflow_artifacts:
